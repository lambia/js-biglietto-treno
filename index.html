<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<h1>Calcolo biglietto treno</h1>
	<form id="biglietto-form">
		<input type="number" id="chilometri" autocomplete="off">
		<select id="fascia-eta" autocomplete="off">
			<option value="junior">Tariffa Junior (&lt;18)</option>
			<option value="base" selected>Tariffa Base (18-64)</option>
			<option value="senior">Tariffa Senior (&gt;64)</option>
		</select>
		<button type="submit" id="calcola">Calcola</button>
		<button type="reset" id="calcola">Reset</button>
	</form>
	<div id="costo-biglietto"></div>

	<script src="main.js"></script>
</body>

</html>
